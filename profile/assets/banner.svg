<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#002151"/>
      <stop offset="1" stop-color="#0a3570"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1280" height="320" rx="24"/>
    </clipPath>
    <style>
      .title { font: 700 64px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: -1px; }
      .tag   { font: 400 25px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #c9d6ea; }
      .chips { font: 600 17px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: 1.5px; }
      .code  { font: 400 15px Consolas, 'SF Mono', Menlo, monospace; fill: #5f7fae; }
      .kw    { fill: #8fb3e6; font-weight: 700; }
      .str   { fill: #65BA13; }
      .pulse { animation: pulse 3.5s ease-in-out infinite; transform-origin: 196px 160px; }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>

    <!-- faded brand mark, large, on the right -->
    <g opacity="0.07" transform="translate(905 -40) scale(1.0)">
      <rect x="0" y="30" width="215" height="160" fill="#ffffff"/>
      <rect x="237" y="0" width="183" height="205" fill="#ffffff"/>
      <rect x="25" y="215" width="172" height="170" fill="#ffffff"/>
      <rect x="215" y="228" width="205" height="186" fill="#ffffff"/>
    </g>

    <!-- a few lines of Delphi in the background -->
    <g class="code" opacity="0.9">
      <text x="905" y="214"><tspan class="kw">uses</tspan> Markdown4D, Chart4D, Pdf4D;</text>
      <text x="905" y="240"><tspan class="kw">begin</tspan></text>
      <text x="925" y="266">Server.Start(<tspan class="str">'mcp'</tspan>);</text>
      <text x="905" y="292"><tspan class="kw">end</tspan>.</text>
    </g>

    <!-- green accent line -->
    <rect x="0" y="312" width="1280" height="8" fill="#65BA13"/>
  </g>

  <!-- GDK brand mark -->
  <svg x="104" y="70" width="184" height="181" viewBox="0 0 420 414">
    <rect x="0" y="30" width="215" height="160" fill="#ffffff"/>
    <rect x="237" y="0" width="183" height="205" fill="#ffffff"/>
    <rect x="25" y="215" width="172" height="170" fill="#ffffff"/>
    <rect x="215" y="228" width="205" height="186" fill="#ffffff"/>
    <circle cx="207" cy="207" r="92" fill="#002151"/>
  </svg>
  <circle class="pulse" cx="196" cy="160" r="29" fill="#65BA13"/>

  <text x="350" y="146" class="title">GDK Software</text>
  <text x="352" y="190" class="tag">We build, upgrade and maintain Delphi applications worldwide.</text>

  <!-- chips -->
  <g>
    <rect x="352" y="220" width="96" height="36" rx="18" fill="#65BA13"/>
    <text x="400" y="244" text-anchor="middle" class="chips">DELPHI</text>
    <rect x="460" y="220" width="64" height="36" rx="18" fill="none" stroke="#65BA13" stroke-width="2"/>
    <text x="492" y="244" text-anchor="middle" class="chips">AI</text>
    <rect x="536" y="220" width="164" height="36" rx="18" fill="none" stroke="#65BA13" stroke-width="2"/>
    <text x="618" y="244" text-anchor="middle" class="chips">OPEN SOURCE</text>
  </g>
</svg>
